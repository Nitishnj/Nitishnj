<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="480" height="200" rx="16" fill="#0e0a20" stroke="#7c5cff33"/>
  <text x="24" y="34" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#f2f0ff">Most Used Languages</text>

  <g font-family="Consolas, monospace" font-size="13" fill="#c9c3ff">
    <text x="24" y="62">Python</text>
    <rect x="120" y="50" width="320" height="10" rx="5" fill="#ffffff14"/>
    <rect x="120" y="50" width="0" height="10" rx="5" fill="#39ff88"><animate attributeName="width" from="0" to="230" dur="1.2s" begin="0.1s" fill="freeze"/></rect>
    <text x="450" y="62" text-anchor="end" fill="#39ff88">48%</text>

    <text x="24" y="92">JavaScript</text>
    <rect x="120" y="80" width="320" height="10" rx="5" fill="#ffffff14"/>
    <rect x="120" y="80" width="0" height="10" rx="5" fill="#ffd939"><animate attributeName="width" from="0" to="150" dur="1.2s" begin="0.25s" fill="freeze"/></rect>
    <text x="450" y="92" text-anchor="end" fill="#ffd939">24%</text>

    <text x="24" y="122">SQL</text>
    <rect x="120" y="110" width="320" height="10" rx="5" fill="#ffffff14"/>
    <rect x="120" y="110" width="0" height="10" rx="5" fill="#4ee1ff"><animate attributeName="width" from="0" to="95" dur="1.2s" begin="0.4s" fill="freeze"/></rect>
    <text x="450" y="122" text-anchor="end" fill="#4ee1ff">15%</text>

    <text x="24" y="152">HTML/CSS</text>
    <rect x="120" y="140" width="320" height="10" rx="5" fill="#ffffff14"/>
    <rect x="120" y="140" width="0" height="10" rx="5" fill="#ff6ec7"><animate attributeName="width" from="0" to="52" dur="1.2s" begin="0.55s" fill="freeze"/></rect>
    <text x="450" y="152" text-anchor="end" fill="#ff6ec7">8%</text>

    <text x="24" y="182">Other</text>
    <rect x="120" y="170" width="320" height="10" rx="5" fill="#ffffff14"/>
    <rect x="120" y="170" width="0" height="10" rx="5" fill="#a86bff"><animate attributeName="width" from="0" to="32" dur="1.2s" begin="0.7s" fill="freeze"/></rect>
    <text x="450" y="182" text-anchor="end" fill="#a86bff">5%</text>
  </g>
</svg>
